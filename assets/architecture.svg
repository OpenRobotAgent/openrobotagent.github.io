<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="565" viewBox="0 0 1150 565" role="img" aria-labelledby="ttl desc">
<title id="ttl">Open Robot Agent — conceptual system architecture</title>
<desc id="desc">The current concept has task and sensory context entering a general multimodal agent, mediated through a trusted harness toward robot execution, with real feedback returning to the agent. Step and Navigate are target future interfaces.</desc>
<defs>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" stroke="#8295a9" stroke-width="1.6" fill="none"/></marker>
 <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" stroke="#4d9f89" stroke-width="1.6" fill="none"/></marker>
 <style>text{font-family:Arial,'Helvetica Neue',sans-serif}.title{font-size:20px;font-weight:700;fill:#192f49}.sub{font-size:13px;fill:#697e91}.mini{font-size:11px;fill:#7890a4;letter-spacing:1.1px}.label{font-size:15px;font-weight:700;fill:#264764}.line{stroke:#8b9aad;stroke-width:2;fill:none}.dash{stroke-dasharray:6 7}.card{fill:#fff;stroke:#dde5ee;stroke-width:1.5}</style>
</defs>
<rect width="1150" height="565" fill="#fafcff"/>
<path d="M0 78H1150M0 487H1150" stroke="#eef2f7"/>
