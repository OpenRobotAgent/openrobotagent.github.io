<text x="72" y="235" class="sub">Capabilities / Task history</text>
<rect x="344" y="110" width="263" height="153" rx="17" fill="#edf3fa" stroke="#bfd2e6" stroke-width="1.7"/>
<rect x="344" y="110" width="7" height="153" rx="3" fill="#5188bd"/>
<text x="371" y="146" class="mini">INTELLIGENCE</text>
<text x="371" y="181" class="title">Multimodal Agent</text>
<text x="371" y="213" class="sub">Ground / Reason / Plan</text>
<text x="371" y="235" class="sub">Predict / Decide / Adapt</text>
<rect x="646" y="110" width="225" height="153" rx="17" class="card"/>
<rect x="646" y="110" width="7" height="153" rx="3" fill="#597fa7"/>
<text x="673" y="146" class="mini">TRUSTED MEDIATION</text>
<text x="673" y="181" class="title">ORA Harness</text>
<text x="673" y="213" class="sub">Tools / Robot Card</text>
<text x="673" y="235" class="sub">Evidence / Permissions</text>
<rect x="911" y="110" width="196" height="153" rx="17" fill="#eef8f3" stroke="#bfdccb" stroke-width="1.5"/>
<rect x="911" y="110" width="7" height="153" rx="3" fill="#56a98c"/>
<text x="939" y="146" class="mini">PHYSICAL SYSTEM</text>
<text x="939" y="181" class="title">Robot</text>
<text x="939" y="213" class="sub">Plan / IK / Execute</text>
<text x="939" y="235" class="sub">Safety / Control</text>
