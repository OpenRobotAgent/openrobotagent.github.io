<text x="627" y="425" text-anchor="middle" class="sub" font-weight="700">Agent selects intent. Trusted execution enforces constraints.</text>
<text x="627" y="441" text-anchor="middle" font-size="10" fill="#7990a5">Measured outcomes close the loop. No unverified performance is implied.</text>
<text x="50" y="522" class="mini">CONCEPTUAL ABSTRACTION · NO CLAIM OF RELEASED OR VALIDATED TOOL INTERFACES</text>
