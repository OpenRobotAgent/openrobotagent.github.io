<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 535" width="1180" height="535" role="img" aria-labelledby="title desc">
<title id="title">ORA conceptual system architecture</title>
<desc id="desc">Goals and observations inform a multimodal agent. A trusted harness mediates action intent, a robot executes within constraints, and measured physical outcomes feed the next decision.</desc>
<defs>
 <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d344e"/><stop offset="1" stop-color="#0d2136"/></linearGradient>
 <linearGradient id="back" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fcfdff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fbf8"/><stop offset="1" stop-color="#e8f5f1"/></linearGradient>
 <radialGradient id="aurora"><stop stop-color="#6c9dc8" stop-opacity=".44"/><stop offset="1" stop-color="#6c9dc8" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-15%" y="-25%" width="135%" height="165%"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#173550" flood-opacity=".095"/></filter>
 <marker id="arrow" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="10" refY="6" orient="auto"><path d="M2 2 10 6 2 10" stroke="#97a9ba" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="arrow-feedback" viewBox="0 0 12 12" markerWidth="10" markerHeight="10" refX="10" refY="6" orient="auto"><path d="M2 2 10 6 2 10" stroke="#d7a06d" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>
 text{font-family:"Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", "Segoe UI", Arial, sans-serif}
 .top{font-size:11px;font-weight:700;fill:#8294a6;letter-spacing:1.7px}
 .name{font-size:23px;font-weight:700;fill:#20364e;letter-spacing:-.35px}
 .namewhite{font-size:25px;font-weight:730;fill:#f4f8fc;letter-spacing:-.4px}
 .sub{font-size:13px;font-weight:400;fill:#708397}
 .subwhite{font-size:13px;fill:#b2c8d9}
 .step{font-size:11px;letter-spacing:1.7px;font-weight:750;fill:#71889f}
 .line{stroke:#a0afbf;stroke-width:2;stroke-linecap:round;fill:none}
 </style>
</defs>
<rect width="1180" height="535" fill="url(#back)"/>
<!-- subtle vertical grids are spatial texture, never content -->
<path d="M39 74H1141M39 384H1141" stroke="#e9eef3" stroke-width="1"/>
<path d="M296 79V373M604 79V373M900 79V373" stroke="#eaf0f5" stroke-width="1" stroke-dasharray="3 9"/>
<!-- Kicker: quiet wayfinding labels -->
<text x="68" y="59" class="step">01  /  INPUT</text>
<text x="344" y="59" class="step">02  /  DECISION</text>
<text x="651" y="59" class="step">03  /  TRUSTED BOUNDARY</text>
<text x="953" y="59" class="step">04  /  PHYSICAL ACTION</text>

<!-- observation, airy and illustrated -->
<rect x="48" y="101" width="227" height="260" rx="20" fill="#ffffff" stroke="#dfe7ef" stroke-width="1.4"/>
<rect x="78" y="134" width="132" height="105" rx="10" fill="#edf4f9" stroke="#cee0ed"/>
<rect x="94" y="149" width="132" height="105" rx="10" fill="#f7fbfe" stroke="#bfd5e5"/>
<path d="M105 222 138 194 159 209 191 170 213 193" fill="none" stroke="#a4bfd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="118" y="171" width="47" height="38" rx="5" fill="none" stroke="#6e98bd" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="164" cy="185" r="5" fill="#4c88ba"/>
<path d="M174 170 202 170 202 197" fill="none" stroke="#83a8c7" stroke-width="1.6"/>
<circle cx="203" cy="170" r="3" fill="#83a8c7"/>
<text x="72" y="294" class="name" font-size="22">Observations</text>
<text x="72" y="323" class="sub">Goals · vision · robot state</text>

<!-- model, visual centerpiece -->
<rect x="315" y="100" width="282" height="262" rx="22" fill="url(#agent)" filter="url(#shadow)"/>
<rect x="315.8" y="100.8" width="280.4" height="260.4" rx="21" fill="none" stroke="#47627d" opacity=".65"/>
<ellipse cx="456" cy="205" rx="148" ry="130" fill="url(#aurora)" opacity=".55"/>
<!-- neural orbits: translucent, precise, quiet -->
<g transform="translate(464 203)" fill="none" stroke-linecap="round">
<circle r="64" stroke="#a5c5de" stroke-width="1.1" stroke-opacity=".28"/>
<ellipse rx="89" ry="29" stroke="#a5c5de" stroke-width="1.15" stroke-opacity=".35" transform="rotate(-27)"/>
<ellipse rx="76" ry="49" stroke="#7fb3d8" stroke-width="1.1" stroke-opacity=".32" transform="rotate(36)"/>
<circle r="35" stroke="#c0dcec" stroke-opacity=".54" stroke-width="1.1"/>
<circle r="11" fill="#bbdbe9" stroke="none" opacity=".85"/>
<circle cx="-61" cy="-8" r="4" fill="#8bc9e5" stroke="none"/>
<circle cx="63" cy="10" r="3.5" fill="#81b3d2" stroke="none"/>
<circle cx="-23" cy="-39" r="3" fill="#a4cfde" stroke="none"/>
<circle cx="55" cy="-49" r="2.5" fill="#8dc4cf" stroke="none"/>
<circle cx="-35" cy="61" r="3.2" fill="#81bcd0" stroke="none"/>
</g>
<text x="344" y="300" class="namewhite">Multimodal agent</text>
<text x="344" y="329" class="subwhite">Understand · reason · decide</text>

<!-- trusted harness, with shield seal and separated facets -->
<rect x="636" y="101" width="249" height="260" rx="20" fill="#ffffff" stroke="#dce6ef" stroke-width="1.4"/>
<circle cx="698" cy="187" r="37" fill="#eff5fa"/>
<path d="M698 164 722 173V191C722 210 710 222 698 228 686 222 674 210 674 191V173Z" fill="#f8fcfe" stroke="#477ba9" stroke-width="2.3" stroke-linejoin="round"/>
<path d="m686 194 9 9 18-20" fill="none" stroke="#477ba9" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<g stroke="#9ab2c7" stroke-width="1.7" fill="none" opacity=".8">
<path d="M759 166h72M759 185h52M759 204h63"/>
</g>
<circle cx="748" cy="166" r="2" fill="#6797b9"/><circle cx="748" cy="185" r="2" fill="#6797b9"/><circle cx="748" cy="204" r="2" fill="#6797b9"/>
<text x="663" y="294" class="name">ORA Harness</text>
<text x="663" y="323" class="sub">Tools · access · safety</text>

<!-- robot in world, fine engineering silhouette -->
<rect x="923" y="101" width="218" height="260" rx="20" fill="url(#mint)" stroke="#cce7dd" stroke-width="1.4"/>
<g fill="none" stroke="#477d74" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round">
<path d="M952 245H1081" stroke="#9dcfc0" stroke-width="1.5"/>
<rect x="961" y="236" width="53" height="10" rx="3" fill="#d7eae3" stroke="#78a99a" stroke-width="1.5"/>
<path d="M985 236V218L1004 204" stroke-width="14" stroke="#bdddd3"/>
<path d="M1005 205 1034 178" stroke-width="14" stroke="#89b7ac"/>
<path d="M1035 178 1072 205" stroke-width="12" stroke="#6fa89c"/>
<circle cx="1005" cy="205" r="12" fill="#f8fefd" stroke="#497f76" stroke-width="3"/>
<circle cx="1034" cy="178" r="11" fill="#f8fefd" stroke="#497f76" stroke-width="3"/>
<circle cx="1072" cy="205" r="9" fill="#f8fefd" stroke="#497f76" stroke-width="3"/>
<path d="M1080 204L1090 214M1075 211 1084 222" stroke-width="3"/>
<rect x="1086" y="220" width="24" height="24" rx="4" stroke="#c09c78" stroke-width="1.6" fill="#fff7ed"/>
</g>
<g fill="#fff"><circle cx="1005" cy="205" r="3"/><circle cx="1034" cy="178" r="3"/><circle cx="1072" cy="205" r="2"/></g>
<path d="M1041 152Q1059 133 1081 152" stroke="#89b9a9" fill="none" stroke-width="1.5" stroke-dasharray="3 5"/>
<text x="950" y="294" class="name" font-size="21">Robot &amp; world</text>
<text x="950" y="323" class="sub">Motion planning · execution</text>

<!-- deliberate minimal forward motion -->
<path d="M275 230H305" class="line" marker-end="url(#arrow)"/>
<path d="M597 230H626" class="line" marker-end="url(#arrow)"/>
<path d="M885 230H913" class="line" marker-end="url(#arrow)"/>

<!-- measured physical return loop -->
<path d="M1032 361V415Q1032 435 1012 435H157Q137 435 137 415V364" stroke="#d7a06d" stroke-width="2.8" fill="none" stroke-linecap="round" marker-end="url(#arrow-feedback)"/>
<circle cx="1032" cy="362" r="5" fill="#d7a06d" stroke="#fff" stroke-width="2"/>
<rect x="422" y="400" width="336" height="67" rx="18" fill="#ffffff" stroke="#eed9c7" stroke-width="1.3"/>
<path d="M446 435h24" stroke="#d7a06d" stroke-width="2" stroke-linecap="round"/>
<circle cx="458" cy="435" r="4" fill="#d7a06d"/>
<text x="481" y="428" font-size="17" font-weight="700" fill="#9b6c43">Measured feedback</text>
<text x="481" y="449" font-size="12" fill="#b28b68">Outcomes  ·  evidence  ·  errors</text>

<!-- editorial bottom line -->
<text x="48" y="502" font-size="11" fill="#7e91a3" font-weight="550">The agent selects intent    /    Trusted execution enforces constraints    /    Reality informs the next step</text>
<text x="1139" y="502" text-anchor="end" font-size="10" fill="#b2bdc9">ORA / 01</text>
</svg>