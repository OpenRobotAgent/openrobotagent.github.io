  <path d="M911 89 817 156" stroke="#2d465b" stroke-width="41"/>
  <path d="M911 89 817 156" stroke="url(#titanium)" stroke-width="28"/>
  <circle cx="818" cy="156" r="18" fill="url(#shadowmetal)" stroke="#cbdde8" stroke-width="5"/>
  <path d="M818 156 801 181" stroke="#cedee9" stroke-width="18"/>
  <path d="M801 181 775 200 766 226" fill="none" stroke="#425d70" stroke-width="17"/>
  <path d="M800 183 786 203 781 220" fill="none" stroke="#d7e6f0" stroke-width="10"/>
  <path d="M804 183 817 206 818 227" fill="none" stroke="#ccdce5" stroke-width="10"/>
 </g>
 <path d="M780 226V235" stroke="#f4cd8f" stroke-width="2" stroke-dasharray="3 4"/>
 <!-- Right compact belief / physical control labels -->
 <g fill="#2f4258" font-size="17" font-weight="530" letter-spacing="1.8">
  <text x="1143" y="196">理解</text>
  <text x="1143" y="224">推理</text>
  <text x="1143" y="252">行动</text>
 </g>
 <path d="M1143 271H1176" stroke="#688093" stroke-width="1.4"/>
 <g fill="#576d83" font-size="11.8">
  <text x="1143" y="297">让机器人</text>
  <text x="1143" y="315">理解并作用于</text>
  <text x="1143" y="333">真实世界</text>
 </g>
</g>
<rect x="5.5" y="5.5" width="1271" height="385" rx="11.5" fill="none" stroke="#dbe5ee"/>
</svg>