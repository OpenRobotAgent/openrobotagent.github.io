 <path d="M506 225C516 155 660 154 815 216C938 265 1058 194 1140 94C1199 22 1102 9 1002 55" stroke="#f1d2a9" stroke-opacity=".58" stroke-width="7" fill="none" filter="url(#softglow)"/>
 <path d="M506 225C516 155 660 154 815 216C938 265 1058 194 1140 94C1199 22 1102 9 1002 55" stroke="#fbf6eb" stroke-opacity=".89" stroke-width="2.8" fill="none"/>
 <g fill="#f0bc6d"><circle cx="604" cy="200" r="5.7"/><circle cx="1134" cy="101" r="5"/></g>
 <g filter="url(#softglow)" fill="#efbd78" opacity=".7"><circle cx="604" cy="200" r="13"/><circle cx="1134" cy="101" r="12"/></g>
 <!-- Physical world: glass blocks -->
 <g filter="url(#drop)">
 <g transform="translate(646 268)"><path d="M0 18 46 0 80 15 35 33Z" fill="#e5f5fc" opacity=".74"/><path d="M0 18 35 33 35 91 0 72Z" fill="url(#cube)" stroke="#c7dfed" stroke-opacity=".85"/><path d="M35 33 80 15 80 76 35 91Z" fill="#adc6d8" opacity=".5" stroke="#c8e3f4" stroke-opacity=".7"/></g>
 <g transform="translate(868 245)"><path d="M0 28 54 2 102 23 48 49Z" fill="#eef9ff" opacity=".7"/><path d="M0 28 48 49 48 136 0 113Z" fill="url(#cube)" stroke="#f2fdff" stroke-opacity=".8"/><path d="M48 49 102 23 102 110 48 136Z" fill="#b8cfe0" opacity=".42" stroke="#e8f7ff" stroke-opacity=".75"/></g>
 <g transform="translate(1029 285)"><path d="M0 13 36 0 69 13 34 28Z" fill="#f0f8fe" opacity=".7"/><path d="M0 13 34 28 34 77 0 63Z" fill="url(#cube)" stroke="#f2f8fc"/><path d="M34 28 69 13 69 61 34 77Z" fill="#a6bdcf" opacity=".4" stroke="#ebf8ff"/></g>
 </g>
 <!-- Target block -->
 <g filter="url(#drop)" transform="translate(732 225)">
