 <!-- Editorial ORA wordmark -->
 <g fill="#1c2c40">
  <text x="82" y="169" font-size="132" font-weight="760" letter-spacing="-10">ORA</text>
 </g>
 <circle cx="389" cy="145" r="9.5" fill="#e7ac55"/>
 <text x="86" y="207" font-size="25" letter-spacing="7.5" fill="#33485d">Open Robot Agent</text>
 <path d="M87 231H134" stroke="#293b51" stroke-width="2.2" stroke-linecap="round"/>
 <text x="87" y="291" class="zh">面向物理世界的通用机器人智能体</text>
 <text x="87" y="319" class="en">A General-Purpose Robot Agent for the Physical World.</text>
