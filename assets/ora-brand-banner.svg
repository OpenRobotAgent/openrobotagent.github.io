<svg xmlns="http://www.w3.org/2000/svg" width="1282" height="396" viewBox="0 0 1282 396" role="img" aria-labelledby="ttl dsc">
<title id="ttl">ORA · Open Robot Agent — 面向物理世界的通用机器人智能体</title>
<desc id="dsc">浅灰蓝空间背景，左侧 ORA 项目标识，中间机器人夹爪与透明立方体，右侧理解、推理、行动理念。根据 ORA 原创品牌海报制作的可编辑矢量版本。</desc>
<defs>
<linearGradient id="back" x1=".02" y1=".1" x2=".9" y2="1"><stop stop-color="#edf2f6"/><stop offset=".49" stop-color="#d8e3ef"/><stop offset="1" stop-color="#afc1d3"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cedae5" stop-opacity=".15"/><stop offset="1" stop-color="#728ca8" stop-opacity=".34"/></linearGradient>
<linearGradient id="titanium" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f9fcff"/><stop offset=".22" stop-color="#dce7f0"/><stop offset=".57" stop-color="#8ba2b5"/><stop offset=".8" stop-color="#d8e3ed"/><stop offset="1" stop-color="#4e667c"/></linearGradient>
<linearGradient id="shadowmetal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#243748"/><stop offset=".45" stop-color="#688196"/><stop offset="1" stop-color="#1c3245"/></linearGradient>
<linearGradient id="cube" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f3fbff" stop-opacity=".78"/><stop offset=".6" stop-color="#bfd5e7" stop-opacity=".3"/><stop offset="1" stop-color="#788da3" stop-opacity=".27"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c8e8f8" stop-opacity="0"/><stop offset=".45" stop-color="#fffdfa"/><stop offset=".72" stop-color="#efc590"/><stop offset="1" stop-color="#c8e8f8" stop-opacity="0"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#f5d3a3" stop-opacity=".56"/><stop offset="1" stop-color="#f5d3a3" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="17"/></filter>
<filter id="drop" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="2" dy="7" stdDeviation="8" flood-color="#33516a" flood-opacity=".24"/></filter>
<filter id="softglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
<clipPath id="clip"><rect x="5" y="5" width="1272" height="386" rx="12"/></clipPath>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif}
.zh{fill:#344960;font-size:18px;letter-spacing:1.6px}
.en{fill:#647990;font-size:13px;letter-spacing:1.1px}
</style>
</defs>
<g clip-path="url(#clip)">
 <rect x="5" y="5" width="1272" height="386" fill="url(#back)"/>
 <g opacity=".24" fill="#6e8ba2" filter="url(#blur)">
  <rect x="667" y="112" width="55" height="192"/><rect x="730" y="92" width="32" height="204"/><rect x="810" y="112" width="65" height="186"/>
  <rect x="948" y="74" width="30" height="232"/><rect x="997" y="118" width="61" height="177"/>
  <rect x="1075" y="87" width="42" height="211"/><rect x="1170" y="138" width="38" height="158"/>
 </g>
 <path d="M0 305Q560 274 1282 315L1282 396H0Z" fill="url(#floor)"/>
