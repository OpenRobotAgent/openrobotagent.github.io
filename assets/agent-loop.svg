<svg xmlns="http://www.w3.org/2000/svg" width="710" height="575" viewBox="0 0 710 575" role="img" aria-labelledby="t d">
<title id="t">Robot Agent physical feedback loop</title>
<desc id="d">An editorial concept figure showing perception, embodied reasoning, action, and physical feedback circling around a robot manipulator.</desc>
