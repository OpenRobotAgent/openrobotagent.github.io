 <rect x="42" y="416" width="185" height="64" rx="12" class="chip"/><circle cx="62" cy="434" r="5" fill="#7cc9d0"/><text x="75" y="438" class="small">04 / VERIFY</text><text x="60" y="460" class="label">What happened?</text>
